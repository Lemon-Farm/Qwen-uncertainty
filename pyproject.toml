[project]
name = "vlm-uncertainty"
version = "0.1.0"
description = "Vision-language uncertainty experiments with Qwen2.5-VL."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=0.34.0",
    "datasets>=2.20.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0.0",
    "qwen-vl-utils>=0.0.8",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "tqdm>=4.66.0",
    "transformers>=4.51.0",
]

[project.scripts]
vlm-infer = "vlm_uncertainty.cli.infer:main"
vlm-batch-infer = "vlm_uncertainty.cli.batch_infer:main"
prepare-vizwiz-vqa = "vlm_uncertainty.cli.prepare_vizwiz:main"
prepare-docvqa = "vlm_uncertainty.cli.prepare_docvqa:main"
prepare-textvqa = "vlm_uncertainty.cli.prepare_textvqa:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vlm_uncertainty"]

[tool.uv]
package = true
